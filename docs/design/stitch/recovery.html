<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-semibold text-on-surface tracking-tight mb-2">Recuperar contraseña</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant max-w-[320px] mx-auto leading-relaxed px-1">Ingresa tus datos para restablecer el acceso a tu cuenta.</p>
</div>
<!-- Liquid Glass Form Container -->
<section class="liquid-glass-card rounded-[24px] p-6 mb-6">
<form class="space-y-5" id="recovery-form" onsubmit="event.preventDefault(); simulateSubmission();"><!-- Campo 1: Correo electrónico -->
<div class="space-y-2">
  <label class="block font-label-md text-label-md text-on-surface font-medium" for="recovery-email">
    Correo electrónico
  </label>
  <div class="relative rounded-lg input-ambient-glow transition-all duration-300">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-on-surface-variant">
      <span class="material-symbols-outlined text-[20px]">mail</span>
    </div>
    <input autocomplete="email" class="w-full h-[52px] pl-11 pr-4 bg-white/[0.035] border border-white/10 rounded-lg text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:outline-none focus:ring-0 transition-colors" id="recovery-email" name="email" placeholder="tu@correo.com" required="" type="email">
  </div>
</div>

<!-- Campo 2: Nueva contraseña -->
<div class="space-y-2">
  <label class="block font-label-md text-label-md text-on-surface font-medium" for="new-password">
    Nueva contraseña
  </label>
  <div class="relative rounded-lg input-ambient-glow transition-all duration-300">
    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-on-surface-variant">
      <span class="material-symbols-outlined text-[20px]">lock</span>
    </div>
    <input autocomplete="new-password" class="w-full h-[52px] pl-11 pr-11 bg-white/[0.035] border border-white/10 rounded-lg text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:outline-none focus:ring-0 transition-colors" id="new-password" name="new_password" placeholder="••••••••" required="" type="password">
    <button type="button" onclick="const el = document.getElementById('new-password'); const icon = this.querySelector('.material-symbols-outlined'); if(el.type==='password'){el.type='text'; icon.textContent='visibility_off';}else{el.type='password'; icon.textContent='visibility';}" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-on-surface-variant hover:text-primary transition-colors cursor-pointer" aria-label="Mostrar u ocultar contraseña">
      <span class="material-symbols-outlined text-[20px]">visibility</span>
    </button>
  </div>
</div>

<!-- Campo 3: Confirmar nueva contraseña -->
<div class="space-y-2">

    Confirmar nueva contraseña

    </button>
  </div>
</div>

<!-- CTA: Cambiar contraseña -->
<button class="couture-button-gradient w-full h-[54px] rounded-full flex items-center justify-center gap-2.5 text-on-primary font-label-lg text-label-lg font-semibold tracking-wide transition-all duration-200 active:scale-[0.98] cursor-pointer mt-3" id="submit-btn" type="submit">
  <span class="">Cambiar contraseña</span>
  <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button></form>

<span class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:-translate-x-0.5">arrow_back</span>

</a>

<footer class="relative z-10 w-full py-4 text-center">

      • ATELIER PRIVÉ •
    </p>
</footer>
<!-- Micro-interactions: Feedback inline trigger -->
<script>
    function simulateSubmission() {
      const emailInput = document.getElementById('recovery-email');
      const toast = document.getElementById('status-toast');
      const submitBtn = document.getElementById('submit-btn');

      if (emailInput.checkValidity() && emailInput.value.trim() !== '') {
        // Subtle loading pulse feedback
        submitBtn.disabled = true;
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
          <span>Enviando...</span>
        `;
        
        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = `
            <span>Enlace enviado</span>
            <span class="material-symbols-outlined text-[20px]">check</span>
          `;
          submitBtn.classList.remove('couture-button-gradient');
          submitBtn.classList.add('bg-surface-variant', 'border-white/20', 'text-on-surface');

          toast.classList.remove('hidden');
          toast.classList.add('flex');
        }, 800);
      }
    }
  </script>
