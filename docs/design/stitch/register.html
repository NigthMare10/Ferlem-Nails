<style>
    /* Architectural Liquid Glass Effects & Subtle Specular Highlights */
    .glass-card-substrate {
      background: rgba(255, 255, 255, 0.045);
      backdrop-filter: blur(36px) saturate(150%);
      -webkit-backdrop-filter: blur(36px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 48px -12px rgba(17, 13, 21, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.22);
    }

    }

    .glass-input {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-input:focus-within {
      background: rgba(255, 255, 255, 0.06);

<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen selection:bg-primary-container selection:text-on-primary-container flex flex-col justify-between overflow-x-hidden font-body-md text-body-md">

<div class="absolute -top-32 -left-24 w-96 h-96 rounded-full bg-primary-container/10 blur-[90px]"></div>
<div class="absolute top-1/3 -right-28 w-[380px] h-[380px] rounded-full bg-secondary/10 blur-[100px]"></div>
<div class="absolute -bottom-24 left-1/4 w-80 h-80 rounded-full bg-primary/10 blur-[85px]"></div>
</div>
<!-- SHARED COMPONENT: TopAppBar (from JSON Source of Truth) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-space-md py-space-sm h-14 max-w-md mx-auto right-0 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-outline-variant/20 dark:border-outline-variant/20 shadow-sm">

<span class="material-symbols-outlined text-[22px]">close</span>
</a>

<!-- Main Canvas Container -->
<main class="relative z-10 w-full max-w-md mx-auto px-margin pt-20 pb-8 flex-1 flex flex-col justify-center">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-2 tracking-tight">Crear cuenta</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1 max-w-[280px]">Únete a nuestro atelier exclusivo</p>
</div>
<!-- Frosted Liquid Glass Card Form -->
<section class="glass-card-substrate rounded-3xl p-6 relative overflow-hidden">
<!-- Specular Top Rim Accent Line -->
<div class="absolute top-0 inset-x-0 h-[1px] bg-gradient-to-r from-transparent via-white/40 to-transparent"></div>
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Campo: Nombre completo -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="name">
            Nombre completo
          </label>
<div class="glass-input rounded-2xl flex items-center px-4 h-[52px]">
<span class="material-symbols-outlined text-outline text-[20px] mr-3 shrink-0">person</span>
<input autocomplete="name" class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:ring-0 focus:outline-none" id="name" name="name" placeholder="Tu nombre completo" required="" type="text"/>
</div>
</div>
<!-- Campo: Correo electrónico -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="email">
            Correo electrónico
          </label>
<div class="glass-input rounded-2xl flex items-center px-4 h-[52px]">
<span class="material-symbols-outlined text-outline text-[20px] mr-3 shrink-0">mail</span>
<input autocomplete="email" class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:ring-0 focus:outline-none" id="email" name="email" placeholder="tu@correo.com" required="" type="email"/>
</div>
</div>
<!-- Campo: Contraseña -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="password">
            Contraseña
          </label>
<div class="glass-input rounded-2xl flex items-center px-4 h-[52px]">
<span class="material-symbols-outlined text-outline text-[20px] mr-3 shrink-0">lock</span>
<input autocomplete="new-password" class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:ring-0 focus:outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar u ocultar contraseña" class="text-outline hover:text-on-surface focus:outline-none transition-colors ml-2 p-1 flex items-center" id="toggle-password" onclick="toggleVisibility('password', 'toggle-password-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-password-icon">visibility</span>
</button>
</div>
</div>
<!-- Campo: Confirmar contraseña -->
<div class="space-y-1.5">
<label class="block font-label-md text-label-md text-on-surface-variant ml-1" for="confirm-password">
            Confirmar contraseña
          </label>
<div class="glass-input rounded-2xl flex items-center px-4 h-[52px]">
<span class="material-symbols-outlined text-outline text-[20px] mr-3 shrink-0">lock</span>
<input autocomplete="new-password" class="w-full bg-transparent border-0 p-0 text-on-surface placeholder:text-on-surface-variant/40 font-body-md text-body-md focus:ring-0 focus:outline-none" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Mostrar u ocultar confirmación de contraseña" class="text-outline hover:text-on-surface focus:outline-none transition-colors ml-2 p-1 flex items-center" id="toggle-confirm" onclick="toggleVisibility('confirm-password', 'toggle-confirm-icon')" type="button">
<span class="material-symbols-outlined text-[20px]" id="toggle-confirm-icon">visibility</span>
</button>
</div>
</div>
<!-- Botón Principal Couture -->
<div class="pt-3">
<button class="couture-button w-full h-[54px] rounded-full text-on-primary-fixed font-label-lg text-label-lg flex items-center justify-center gap-2 tracking-wide font-semibold transition-all duration-200 group" type="submit">
<span>Crear cuenta</span>
<span class="material-symbols-outlined text-[18px] transition-transform duration-200 group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</form>
</section>
<!-- Enlace de inicio de sesión -->
<div class="mt-6 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
        ¿Ya tienes cuenta? 
        <a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed transition-colors underline-offset-4 hover:underline ml-1" href="#">
          Iniciar sesión
        </a>
</p>
</div>
</main>
<!-- Editorial Micro-Footer -->
<footer class="relative z-10 w-full max-w-md mx-auto py-4 text-center">
<span class="font-label-sm text-label-sm text-outline tracking-[0.25em] opacity-60 select-none">
      • ATELIER PRIVÉ •
    </span>
</footer>
<!-- Vanilla Interaction Script for Password Visibility Toggle -->
<script>
    function toggleVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input && icon) {
        if (input.type === 'password') {
          input.type = 'text';
          icon.textContent = 'visibility_off';
        } else {
          input.type = 'password';
          icon.textContent = 'visibility';
        }
      }
    }
  </script>
