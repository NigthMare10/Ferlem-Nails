<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    
    /* Liquid glass optical boundary and specular highlight */
    .liquid-glass-panel {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.045) 0%, rgba(208, 192, 225, 0.015) 100%);
      box-shadow: 
        0 24px 48px -12px rgba(17, 13, 21, 0.75),
        inset 0 1px 1px 0 rgba(255, 255, 255, 0.35),
        inset 0 0 20px 0 rgba(216, 139, 158, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .liquid-glass-input {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-glass-input:focus-within {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 177, 195, 0.7);
      box-shadow: 0 0 20px -2px rgba(216, 139, 158, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    /* Pearlescent Couture CTA Button */
    .btn-couture {
      background: linear-gradient(135deg, #d88b9e 0%, #a35c70 100%);
      box-shadow: 
        0 12px 28px -4px rgba(216, 139, 158, 0.35),
        inset 0 1px 1px rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .btn-couture:active {
      transform: scale(0.985);
      box-shadow: 
        0 6px 16px -2px rgba(216, 139, 158, 0.4),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen relative overflow-x-hidden antialiased selection:bg-primary-container selection:text-on-primary-fixed">
<!-- Ambient Pearlescent & Iridescent Substrate (Level 0) -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none -z-10 overflow-hidden bg-[#120E16]">
<!-- Top pearlescent aura -->
<div class="absolute -top-[15%] left-1/2 -translate-x-1/2 w-[340px] sm:w-[500px] h-[340px] sm:h-[500px] rounded-full blur-[100px] opacity-40 bg-gradient-to-b from-[#d88b9e]/30 via-[#b8a9c9]/15 to-transparent"></div>
<!-- Deep liquid velvet plum depth -->
<div class="absolute top-[40%] -left-[20%] w-[320px] h-[320px] rounded-full blur-[120px] opacity-25 bg-[#50445f]"></div>
<!-- Subtle specular bottom aura -->
<div class="absolute -bottom-[10%] right-[-10%] w-[300px] h-[300px] rounded-full blur-[90px] opacity-30 bg-[#d88b9e]/20"></div>
</div>
<!-- Shared Component: TopAppBar (Strict Semantic Anchor from JSON) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-space-md py-space-sm h-14 max-w-md mx-auto bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-outline-variant/20 dark:border-outline-variant/20 shadow-sm transition-colors">
<button aria-label="Cerrar" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="close">close</span>
</button>
<div class="text-headline-sm font-headline-sm font-semibold tracking-wider text-on-surface dark:text-on-surface select-none">
      Studio Lemus
    </div>
<button aria-label="Ayuda" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant dark:text-on-surface-variant hover:text-primary dark:hover:text-primary active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Mobile Canvas Container -->
<main class="w-full min-h-screen max-w-md mx-auto px-space-md pt-24 pb-10 flex flex-col justify-between relative z-10">
<!-- Top Editorial Header & Monogram Section -->
<div class="w-full flex flex-col items-center text-center mt-2 mb-6">
<!-- Monogram Emblem (Specular pearlescent facet) -->
<div class="w-14 h-14 rounded-2xl p-[1px] bg-gradient-to-tr from-white/30 via-primary/30 to-white/10 shadow-lg shadow-black/40 mb-4 backdrop-blur-md">
<div class="w-full h-full rounded-[15px] bg-surface-container-lowest/80 flex items-center justify-center relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-primary/10 to-transparent"></div>
<span class="font-headline-sm text-headline-sm text-primary font-semibold tracking-widest pl-0.5">SL</span>
</div>
</div>
<!-- Brand Identity Hierarchy -->
<p class="font-label-sm text-label-sm uppercase tracking-[0.22em] text-secondary font-semibold mb-1.5 opacity-90">
        STUDIO LEMUS
      </p>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-semibold tracking-tight text-balance">
        Bienvenida
      </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1 max-w-[260px]">
        Accede a tu espacio exclusivo
      </p>
</div>
<!-- Liquid Glass Authentication Container (Elevated Specular Sheet) -->
<section class="w-full liquid-glass-panel rounded-3xl backdrop-blur-2xl p-6 sm:p-7 relative overflow-hidden my-auto">
<!-- Ambient specular highlight beam across top card rim -->
<div aria-hidden="true" class="absolute -top-12 left-1/4 w-1/2 h-20 bg-white/10 blur-xl pointer-events-none"></div>
<form class="space-y-5" id="auth-form" onsubmit="event.preventDefault();">
<!-- Field 1: Email Address -->
<div class="space-y-2">
<label class="block font-label-lg text-label-lg text-on-surface tracking-wide" for="email">
            Correo electrónico
          </label>
<div class="liquid-glass-input rounded-2xl h-14 px-4 flex items-center gap-3">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px] select-none" data-icon="mail">mail</span>
<input autocomplete="email" class="w-full bg-transparent border-none p-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 focus:outline-none" id="email" name="email" placeholder="tu@correo.com" required="" type="email"/>
</div>
</div>
<!-- Field 2: Password with Reveal Action -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="block font-label-lg text-label-lg text-on-surface tracking-wide" for="password">
              Contraseña
            </label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors duration-150 py-1" href="#recuperar" tabindex="0">
              ¿Olvidaste tu contraseña?
            </a>
</div>
<div class="liquid-glass-input rounded-2xl h-14 px-4 flex items-center gap-3">
<span aria-hidden="true" class="material-symbols-outlined text-outline text-[20px] select-none" data-icon="lock">lock</span>
<input autocomplete="current-password" class="w-full bg-transparent border-none p-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:ring-0 focus:outline-none tracking-widest placeholder:tracking-normal" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Alternar visibilidad de contraseña" class="text-outline hover:text-on-surface p-1.5 rounded-lg active:scale-95 transition-all flex items-center justify-center" id="toggle-pwd-btn" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="eye-icon">visibility</span>
</button>
</div>
</div>
<!-- Primary Tactile Submission Trigger (56px ergonomic height) -->
<div class="pt-2">
<button class="btn-couture w-full h-14 rounded-full flex items-center justify-center gap-2 text-white font-label-lg text-label-lg font-semibold tracking-wide transition-all duration-200" type="submit">
<span>Iniciar sesión</span>
<span aria-hidden="true" class="material-symbols-outlined text-[18px] transition-transform group-hover:translate-x-0.5" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</section>
<!-- Bottom Footprint: Account Access Navigation & Serene Micro-Copy -->
<footer class="w-full pt-6 pb-2 text-center flex flex-col items-center">
<div class="inline-flex items-center justify-center flex-wrap gap-1.5 py-2 px-4 rounded-full bg-surface-container-lowest/30 backdrop-blur-md border border-white/5">
<span class="font-body-sm text-body-sm text-on-surface-variant">¿Aún no tienes cuenta?</span>
<a class="font-label-lg text-label-lg text-primary hover:text-primary-fixed underline-offset-4 hover:underline transition-all" href="#crear-cuenta">
          Crear cuenta
        </a>
</div>
<div class="mt-4 flex items-center justify-center gap-2 opacity-40">
<span class="w-1.5 h-1.5 rounded-full bg-primary/80"></span>
<span class="font-label-sm text-label-sm tracking-widest text-outline uppercase">Atelier Privé</span>
<span class="w-1.5 h-1.5 rounded-full bg-primary/80"></span>
</div>
</footer>
</main>
<!-- Lightweight Interaction Logic for Password Reveal -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePwdBtn = document.getElementById('toggle-pwd-btn');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');

      if (togglePwdBtn && passwordInput && eyeIcon) {
        togglePwdBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
          eyeIcon.setAttribute('data-icon', isPassword ? 'visibility_off' : 'visibility');
        });
      }
    });
  </script>
</body></html>
